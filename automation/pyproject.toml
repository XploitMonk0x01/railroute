[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railroute-automation"
version = "0.1.0"
description = "RailRoute AI — Playwright-based IRCTC availability scraper"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44.0",
    "playwright-stealth>=1.0.6",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]


[tool.setuptools.packages.find]
where   = ["."]
include = ["scraper*", "db*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
asyncio_mode = "auto"

