services:
  db:
    image: postgres:16-alpine
    container_name: railroute_db
    restart: always
    environment:
      POSTGRES_USER: master
      POSTGRES_PASSWORD: railroute_pass
      POSTGRES_DB: railroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master -d railroute"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: railroute_backend
    restart: always
    environment:
      RAILROUTE_DATABASE_URL: "postgresql://master:railroute_pass@db:5432/railroute"
      SCRAPER_HEADLESS: "true"
      SCRAPER_MAX_TABS: "6"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railroute_frontend
    restart: always
    environment:
      BACKEND_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
