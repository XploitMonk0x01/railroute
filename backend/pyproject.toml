[project]
name = "railroute-backend"
version = "0.1.0"
description = "RailRoute AI FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "networkx",
    "psycopg[binary]",
    "psycopg-pool",
    "pytest",
    "pytest-asyncio",
    "uvicorn",
    "playwright",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
